<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- Background -->
  <rect width="120" height="120" rx="28" fill="#1c1018"/>

  <!-- Crown shape -->
  <path d="M20 82 L30 42 L50 65 L60 30 L70 65 L90 42 L100 82 Z"
    fill="none" stroke="#f4b3db" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Crown base bar -->
  <rect x="20" y="82" width="80" height="9" rx="4.5" fill="#f4b3db"/>

  <!-- Crown jewels -->
  <circle cx="60" cy="30" r="5" fill="#f2b7c1"/>
  <circle cx="30" cy="42" r="4" fill="#ffb3b1"/>
  <circle cx="90" cy="42" r="4" fill="#ffb3b1"/>

  <!-- AI scan ring -->
  <circle cx="60" cy="60" r="38" stroke="#f4b3db" stroke-width="1.2" stroke-dasharray="4 3" opacity="0.35"/>
  <circle cx="60" cy="60" r="46" stroke="#f2b7c1" stroke-width="0.8" stroke-dasharray="2 5" opacity="0.2"/>
</svg>
