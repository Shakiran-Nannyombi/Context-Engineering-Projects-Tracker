<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Exploring AI, frontend engineering, and user-centered digital experiences through real-world projects.">
    <title>AI-Powered Projects by Shakiran</title>

    <!-- Performance Optimizations -->
    <!-- Preconnect to improve resource loading -->
    <link rel="preconnect" href="https://github.com" crossorigin>

    <!-- Preload critical resources -->
    <link rel="preload" href="styles.min.css" as="style">
    <link rel="preload" href="app.min.js" as="script">
    <link rel="preload" href="projects.json" as="fetch" crossorigin>

    <!-- Load minified CSS for faster parsing -->
    <link rel="stylesheet" href="styles.min.css">

    <!-- Favicon -->
    <link rel="icon" href="./assets/devkiran256-favicon-196.png" type="image/png">

    <!-- Inline critical CSS removed to support dark theme in styles.min.css -->
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>
    <!-- Animated Falling Pattern Background -->
    <div class="falling-pattern-container" aria-hidden="true">
        <div class="falling-pattern-bg"></div>
        <div class="falling-pattern-overlay"></div>
    </div>

    <header>
        <div class="header-brand">
            <img src="./assets/devkiran256-mark-light.svg" alt="DevKiran256" class="brand-logo light-only">
            <img src="./assets/devkiran256-mark-dark.svg" alt="DevKiran256" class="brand-logo dark-only">
            <div class="header-titles">
                <h1>AI-Powered Projects by Shakiran</h1>
                <p class="header-subtitle">Exploring AI, frontend engineering, and user-centered digital experiences through real-world projects.</p>
            </div>
        </div>
        <div class="header-actions">
            <button id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode">
                <span class="icon-sun" style="display: none;"><i data-lucide="sun" class="w-5 h-5"></i></span>
                <span class="icon-moon"><i data-lucide="moon" class="w-5 h-5"></i></span>
            </button>
            <div class="header-profile">
                <img src="./assets/devkiran256-mark-light.svg" alt="Shakiran" class="profile-image light-only">
                <img src="./assets/devkiran256-mark-dark.svg" alt="Shakiran" class="profile-image dark-only">
                <span class="profile-name">Shakiran</span>
            </div>
        </div>
    </header>

    <main>
        <nav id="category-tabs" class="tabs-nav" role="tablist" aria-label="Showcase Categories">
            <button id="tab-projects" class="tab-btn active" role="tab" aria-selected="true" aria-controls="project-grid">
                <i data-lucide="layout-grid" class="tab-icon"></i>
                <span>Projects</span>
            </button>
            <button id="tab-mcp" class="tab-btn" role="tab" aria-selected="false" aria-controls="project-grid">
                <i data-lucide="cpu" class="tab-icon"></i>
                <span>MCP Showcase</span>
            </button>
        </nav>

        <div id="project-grid" class="project-grid" role="list" aria-label="Context Engineered Projects">
            <!-- Project cards will be dynamically inserted here -->
        </div>
    </main>

    <footer>
        <p>
            <a href="https://github.com/Shakiran-Nannyombi/Context-Engineering-Projects-Tracker.git" target="_blank"
                rel="noopener noreferrer">
                View Repository on GitHub
            </a>
        </p>
    </footer>

    <!-- Load minified JavaScript with defer for better performance -->
    <script src="app.min.js" defer></script>
</body>

</html>
